name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          libncurses5-dev \
          libffi-dev \
          libssl-dev

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet buildozer

    - name: Create and configure buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Forcer l'utilisation d'une version d'Android stable dans le fichier de config
        sed -i 's/# android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 24/g' buildozer.spec
        sed -i 's/android.minapi = 21/android.minapi = 24/g' buildozer.spec

    - name: Accept Android SDK licenses and install tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools" || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
